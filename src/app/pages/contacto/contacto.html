<div class="row justify-content-center">
  <div class="col-12 col-md-8 col-lg-6">
    <h2 class="mb-3">Contacto</h2>

    <div class="alert alert-success" *ngIf="enviado">
      ¡Gracias! Recibimos tu mensaje y te responderemos pronto.
    </div>

    <form #f="ngForm" (ngSubmit)="enviar()">
      <div class="mb-3">
        <label class="form-label" for="nombre">Nombre</label>
        <input id="nombre" name="nombre" class="form-control" [(ngModel)]="nombre" required>
      </div>
      <div class="mb-3">
        <label class="form-label" for="correo">Correo</label>
        <input id="correo" name="correo" type="email" class="form-control" [(ngModel)]="correo" required email>
      </div>
      <div class="mb-3">
        <label class="form-label" for="mensaje">Mensaje</label>
        <textarea id="mensaje" name="mensaje" rows="4" class="form-control" [(ngModel)]="mensaje" required></textarea>
      </div>
      <button type="submit" class="btn btn-primary" [disabled]="f.invalid">Enviar</button>
    </form>
  </div>
</div>
