<div class="row justify-content-center">
  <div class="col-12 col-md-6 col-lg-4">
    <div class="card p-4">
      <h2 class="mb-3 text-center">Iniciar sesión</h2>

      <form #formLogin="ngForm" (ngSubmit)="ingresar()">
        <div class="mb-3">
          <label class="form-label" for="correo">Correo</label>
          <input id="correo" name="correo" type="email" class="form-control"
                 [(ngModel)]="correo" required email #campoCorreo="ngModel">
          <div class="text-danger small" *ngIf="campoCorreo.invalid && campoCorreo.touched">
            Ingresa un correo válido.
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label" for="password">Contraseña</label>
          <input id="password" name="password" type="password" class="form-control"
                 [(ngModel)]="password" required minlength="6" #campoPassword="ngModel">
          <div class="text-danger small" *ngIf="campoPassword.invalid && campoPassword.touched">
            La contraseña debe tener al menos 6 caracteres.
          </div>
        </div>

        <div class="alert alert-danger" *ngIf="error">{{ error }}</div>

        <button type="submit" class="btn btn-primary w-100" [disabled]="formLogin.invalid">
          Ingresar
        </button>
      </form>

      <p class="text-muted small mt-3 mb-0">Demo: admin@mundocover.com / 123456</p>
    </div>
  </div>
</div>
